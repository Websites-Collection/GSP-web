<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none" role="img" aria-label="Global Solutions Partner logo">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe27a"/>
      <stop offset="50%" stop-color="#e8b94a"/>
      <stop offset="100%" stop-color="#b9831a"/>
    </linearGradient>
    <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5da9f4"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3f08a"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3b6fd6"/>
      <stop offset="100%" stop-color="#1c3f8c"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe27a"/>
      <stop offset="100%" stop-color="#c8941f"/>
    </linearGradient>
  </defs>

  <!-- outer gold ring -->
  <ellipse cx="200" cy="160" rx="155" ry="120" fill="none" stroke="url(#goldRing)" stroke-width="14" transform="rotate(-18 200 160)"/>

  <!-- blue arc -->
  <path d="M 95 60 A 130 105 0 0 1 290 110" stroke="url(#blueArc)" stroke-width="22" fill="none" stroke-linecap="round" transform="rotate(-10 200 160)"/>

  <!-- green arc -->
  <path d="M 110 245 A 130 105 0 0 0 305 195" stroke="url(#greenArc)" stroke-width="22" fill="none" stroke-linecap="round" transform="rotate(-10 200 160)"/>

  <!-- globe -->
  <circle cx="200" cy="160" r="92" fill="url(#globeGrad)"/>
  <g stroke="#9fc1f5" stroke-width="1.5" opacity="0.55" fill="none">
    <ellipse cx="200" cy="160" rx="92" ry="38"/>
    <ellipse cx="200" cy="160" rx="92" ry="68"/>
    <ellipse cx="200" cy="160" rx="38" ry="92"/>
    <ellipse cx="200" cy="160" rx="68" ry="92"/>
  </g>
  <path d="M150 110c10 18 5 30-6 38-12 9-18 22-10 36 6 12 22 14 26 28 4 12-4 24-14 30 22 6 44-2 56-18 10-14 8-30 22-40 12-9 28-6 38-18 8-10 4-24-6-32" fill="#e8c878" opacity="0.9"/>

  <!-- text -->
  <text x="200" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" fill="url(#goldText)" letter-spacing="4">GLOBAL</text>
  <text x="200" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="url(#goldText)" letter-spacing="6">SOLUTION</text>
  <line x1="60" y1="425" x2="160" y2="425" stroke="#4ade80" stroke-width="3"/>
  <text x="200" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#4ade80" letter-spacing="6">PARTNERS</text>
  <line x1="240" y1="425" x2="340" y2="425" stroke="#4ade80" stroke-width="3"/>
</svg>
